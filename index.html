<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <title>Happy Birthday Shristi</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffc3a0);
      position:relative;
    }

    .card{
      width:90%;
      max-width:700px;
      padding:50px 35px;
      text-align:center;
      border-radius:30px;

      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);

      border:1px solid rgba(255,255,255,0.25);

      box-shadow:0 10px 40px rgba(0,0,0,0.2);

      color:white;

      animation:fadeIn 1.5s ease;
    }

    h1{
      font-size:3.2rem;
      margin-bottom:20px;
      font-weight:700;
    }

    .line{
      font-size:1.25rem;
      line-height:1.8;
      margin-bottom:30px;
    }

    .btn{
      padding:15px 35px;
      border:none;
      border-radius:40px;
      background:white;
      color:#ff4f81;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.08);
      background:#ffe4ee;
    }

    .hidden-message{
      margin-top:25px;
      font-size:1.2rem;
      display:none;
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .heart{
      position:absolute;
      color:white;
      font-size:20px;
      animation:float 6s linear infinite;
      opacity:0.7;
    }

    @keyframes float{

      0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
      }

      50%{
        opacity:1;
      }

      100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
      }
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>Happy Birthday Shristi</h1>

    <div class="line">
      May your smile always shine brighter than the stars.
      <br><br>
      Wishing you endless happiness, beautiful memories,
      and lots of love.
    </div>

    <button class="btn" onclick="showMessage()">
      Open Surprise
    </button>

    <div class="hidden-message" id="msg">
      You deserve every beautiful thing in this world.
    </div>

  </div>

  <script>

    function showMessage(){
      document.getElementById("msg").style.display = "block";
    }

    function createHeart(){

      const heart = document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML = "?";

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.fontSize = (Math.random() * 20 + 15) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      },6000);
    }

    setInterval(createHeart,300);

  </script>

</body>
</html>
